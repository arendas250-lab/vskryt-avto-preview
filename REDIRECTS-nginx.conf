# ===== ВскрытьАвто.бел — 301-редиректы (Nginx) =====
# Основной домен: вскрытьавто.бел (xn--80adb4awjfkc0gm.xn--90ais)

# vskritie-auto.by -> основной (сохранение пути и query)
server {
    listen 80; listen 443 ssl;
    server_name vskritie-auto.by www.vskritie-auto.by;
    return 301 https://xn--80adb4awjfkc0gm.xn--90ais$request_uri;
}
# вскрыть-авто.бел (с дефисом, xn----8sbec1b1akgld8gn.xn--90ais) -> основной
server {
    listen 80; listen 443 ssl;
    server_name xn----8sbec1b1akgld8gn.xn--90ais www.xn----8sbec1b1akgld8gn.xn--90ais;
    return 301 https://xn--80adb4awjfkc0gm.xn--90ais$request_uri;
}
# www + http основного домена -> https без www
server {
    listen 80;
    server_name xn--80adb4awjfkc0gm.xn--90ais www.xn--80adb4awjfkc0gm.xn--90ais;
    return 301 https://xn--80adb4awjfkc0gm.xn--90ais$request_uri;
}
server {
    listen 443 ssl;
    server_name www.xn--80adb4awjfkc0gm.xn--90ais;
    return 301 https://xn--80adb4awjfkc0gm.xn--90ais$request_uri;
}
# Основной сервер
server {
    listen 443 ssl;
    server_name xn--80adb4awjfkc0gm.xn--90ais;
    root /var/www/vskrytavto;   # <- путь к сайту
    index index.html;

    # 301 удалённых услуг -> ближайшая по смыслу
    location = /izgotovlenie-avtoklyucha/ { return 301 /; }
    location = /razmorozka-zamkov-avto/  { return 301 /; }

    # смысловой дубль главной -> главная
    location = /vskrytie-avto/ { return 301 /; }

    # раздел отзывов удалён -> главная
    location = /otzyvy/ { return 301 /; }
    location = /reviews/ { return 301 /; }

    # чистые URL со слешем
    location / { try_files $uri $uri/ $uri/index.html =404; }
    error_page 404 /404.html;
}

